<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fundo branco limpo -->
    <linearGradient id="canMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="15%" stop-color="#2a2a2f" />
      <stop offset="35%" stop-color="#0f0f11" />
      <stop offset="60%" stop-color="#1b1b1e" />
      <stop offset="85%" stop-color="#323238" />
      <stop offset="100%" stop-color="#0d0d0f" />
    </linearGradient>

    <linearGradient id="lidMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a7a82" />
      <stop offset="25%" stop-color="#cfcfd6" />
      <stop offset="50%" stop-color="#f0f0f5" />
      <stop offset="75%" stop-color="#9a9aa3" />
      <stop offset="100%" stop-color="#606068" />
    </linearGradient>

    <linearGradient id="rimMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#555" />
      <stop offset="50%" stop-color="#ddd" />
      <stop offset="100%" stop-color="#444" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66FF00" />
      <stop offset="50%" stop-color="#00FF2A" />
      <stop offset="100%" stop-color="#00CC11" />
    </linearGradient>

    <filter id="clawGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="canShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)" />
      <stop offset="60%" stop-color="rgba(0,0,0,0.12)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="60%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <!-- Fundo Sólido Branco Puro -->
  <rect width="500" height="500" fill="#FFFFFF" />

  <!-- Sombra no Chão -->
  <ellipse cx="250" cy="460" rx="90" ry="16" fill="url(#canShadow)" />

  <!-- Base da Lata -->
  <path d="M 180 435 Q 250 455 320 435 L 315 448 Q 250 462 185 448 Z" fill="url(#rimMetal)" />

  <!-- Corpo Principal da Lata de 473ml (Proporção Esguia) -->
  <rect x="175" y="90" width="150" height="350" rx="6" fill="url(#canMetal)" />

  <!-- Ombro Superior / Estreitamento da Lata -->
  <path d="M 175 90 L 184 62 Q 250 56 316 62 L 325 90 Z" fill="url(#lidMetal)" />

  <!-- Borda Superior da Lata (Aro) -->
  <ellipse cx="250" cy="62" rx="66" ry="10" fill="url(#rimMetal)" stroke="#666" stroke-width="1.5" />
  <!-- Tampa Interna rebaixada -->
  <ellipse cx="250" cy="61" rx="58" ry="7" fill="#252528" />
  <!-- Lacre / Anel preto com furo -->
  <rect x="242" y="55" width="16" height="10" rx="2" fill="#555" />
  <circle cx="250" cy="60" r="2.5" fill="#111" />

  <!-- Textura de Condensação / Gotículas de Gelo -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="190" cy="120" r="1.8" />
    <circle cx="196" cy="145" r="2.2" />
    <circle cx="210" cy="110" r="1.5" />
    <circle cx="225" cy="130" r="2.5" />
    <circle cx="295" cy="115" r="2" />
    <circle cx="310" cy="140" r="2.2" />
    <circle cx="305" cy="180" r="1.8" />
    <circle cx="185" cy="220" r="2.3" />
    <circle cx="192" cy="270" r="1.7" />
    <circle cx="315" cy="250" r="2" />
    <circle cx="308" cy="310" r="2.4" />
    <circle cx="280" cy="380" r="2" />
    <circle cx="220" cy="400" r="1.8" />
    <circle cx="195" cy="415" r="2.5" />
    <circle cx="305" cy="420" r="1.8" />
  </g>

  <!-- Brilho / Reflexo Vertical da Lata -->
  <rect x="175" y="90" width="150" height="350" fill="url(#specularHighlight)" />

  <!-- ==================== GARRA ICÔNICA DO MONSTER ==================== -->
  <g filter="url(#clawGlow)">
    <!-- Garra Esquerda -->
    <path d="M 218 165
             L 212 185
             L 219 205
             L 211 230
             L 217 255
             L 210 270
             L 216 270
             L 226 250
             L 220 225
             L 228 200
             L 222 180
             Z"
          fill="url(#neonGlow)" />

    <!-- Garra Central (Mais Longa) -->
    <path d="M 248 152
             L 241 180
             L 250 215
             L 240 245
             L 252 280
             L 242 300
             L 249 300
             L 262 275
             L 251 240
             L 261 210
             L 252 175
             Z"
          fill="url(#neonGlow)" />

    <!-- Garra Direita -->
    <path d="M 278 168
             L 272 190
             L 281 215
             L 272 235
             L 280 255
             L 273 268
             L 279 268
             L 289 250
             L 282 230
             L 290 210
             L 283 185
             Z"
          fill="url(#neonGlow)" />
  </g>

  <!-- Núcleo Branco Intenso da Garra -->
  <g opacity="0.65">
    <path d="M 216 175 L 214 200 L 217 225 L 213 250 L 218 245 L 222 225 L 219 195 Z" fill="#FFFFFF" />
    <path d="M 246 165 L 243 205 L 248 235 L 243 275 L 253 265 L 249 230 L 254 200 Z" fill="#FFFFFF" />
    <path d="M 276 178 L 274 205 L 278 225 L 274 250 L 282 245 L 279 220 L 283 195 Z" fill="#FFFFFF" />
  </g>

  <!-- TEXTO MONSTER -->
  <text x="250" y="335"
        text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="21"
        font-weight="900"
        letter-spacing="5"
        fill="#FFFFFF">
    MONSTER
  </text>

  <!-- TEXTO ENERGY -->
  <text x="250" y="354"
        text-anchor="middle"
        font-family="'Arial Black', sans-serif"
        font-size="11"
        font-weight="800"
        letter-spacing="4"
        fill="#00FF2A">
    ENERGY
  </text>

  <!-- SELO 473ml NO RODAPÉ DA LATA -->
  <rect x="230" y="415" width="40" height="15" rx="3" fill="#1e1e24" stroke="#444" stroke-width="0.7" />
  <text x="250" y="426"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="9"
        font-weight="700"
        fill="#AAAAAA">
    473 ml
  </text>
</svg>
