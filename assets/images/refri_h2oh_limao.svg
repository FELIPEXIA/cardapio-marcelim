<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente da bebida H2OH! levemente cítrica verde-água translúcida -->
    <linearGradient id="h2oDrink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4f4d2" stop-opacity="0.88" />
      <stop offset="25%" stop-color="#eaf9e7" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f5fcf4" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#dcf6d9" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#bcebc3" stop-opacity="0.88" />
    </linearGradient>

    <!-- Gradiente da tampa verde H2OH! -->
    <linearGradient id="h2oCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b7325" />
      <stop offset="35%" stop-color="#2ba83c" />
      <stop offset="70%" stop-color="#20872e" />
      <stop offset="100%" stop-color="#14571c" />
    </linearGradient>

    <!-- Gradiente do rótulo H2OH! -->
    <linearGradient id="labelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e6822" />
      <stop offset="45%" stop-color="#1d9333" />
      <stop offset="80%" stop-color="#157c2a" />
      <stop offset="100%" stop-color="#0a5219" />
    </linearGradient>

    <!-- Sombra suave no chão -->
    <radialGradient id="shadowFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,70,25,0.24)" />
      <stop offset="60%" stop-color="rgba(15,70,25,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>

    <!-- Brilho especular do plástico -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="35%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.95)" />
      <stop offset="65%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <!-- Fundo Sólido Branco Puro -->
  <rect width="500" height="500" fill="#FFFFFF" />

  <!-- Sombra no Chão -->
  <ellipse cx="250" cy="462" rx="85" ry="14" fill="url(#shadowFloor)" />

  <!-- ==================== GARRAFA H2OH! 500ml ==================== -->
  <!-- Gargalo e Rosca -->
  <rect x="238" y="58" width="24" height="20" rx="2" fill="url(#h2oDrink)" stroke="#98dca5" stroke-width="1" />

  <!-- Tampa Verde com Frisos Verticais -->
  <rect x="234" y="40" width="32" height="22" rx="3" fill="url(#h2oCap)" stroke="#0e541b" stroke-width="1.2" />
  <line x1="240" y1="40" x2="240" y2="62" stroke="#60d874" stroke-width="1.2" opacity="0.7" />
  <line x1="246" y1="40" x2="246" y2="62" stroke="#60d874" stroke-width="1.2" opacity="0.7" />
  <line x1="252" y1="40" x2="252" y2="62" stroke="#60d874" stroke-width="1.2" opacity="0.7" />
  <line x1="258" y1="40" x2="258" y2="62" stroke="#60d874" stroke-width="1.2" opacity="0.7" />
  <!-- Anel de Lacre da Tampa -->
  <rect x="235" y="60" width="30" height="4" fill="#136021" />

  <!-- Corpo da Garrafa Pet H2OH! (Cinturada ergonômica) -->
  <path d="M 238 78
           C 230 115 185 140 185 180
           L 185 240
           C 185 255 190 265 190 275
           C 190 285 185 295 185 305
           L 185 410
           C 185 435 195 448 215 450
           L 285 450
           C 305 448 315 435 315 410
           L 315 305
           C 315 295 310 285 310 275
           C 310 265 315 255 315 240
           L 315 180
           C 315 140 270 115 262 78
           Z"
        fill="url(#h2oDrink)"
        stroke="#84d493"
        stroke-width="1.5" />

  <!-- Frisos de Relevo da Garrafa (Ondulações) -->
  <path d="M 185 195 Q 250 205 315 195" fill="none" stroke="#9ee4ab" stroke-width="1.5" opacity="0.6" />
  <path d="M 186 215 Q 250 225 314 215" fill="none" stroke="#9ee4ab" stroke-width="1.5" opacity="0.6" />
  <path d="M 186 385 Q 250 395 314 385" fill="none" stroke="#9ee4ab" stroke-width="1.5" opacity="0.6" />
  <path d="M 186 405 Q 250 415 314 405" fill="none" stroke="#9ee4ab" stroke-width="1.5" opacity="0.6" />

  <!-- Bolhas Leves de Gás (Levemente gaseificada) -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="218" cy="185" r="2" />
    <circle cx="232" cy="165" r="1.6" />
    <circle cx="248" cy="190" r="2.5" />
    <circle cx="266" cy="170" r="1.8" />
    <circle cx="282" cy="180" r="2.2" />
    
    <circle cx="204" cy="365" r="2" />
    <circle cx="225" cy="380" r="2.8" />
    <circle cx="246" cy="370" r="3" />
    <circle cx="268" cy="390" r="2.2" />
    <circle cx="292" cy="365" r="2.5" />

    <circle cx="212" cy="425" r="2" />
    <circle cx="238" cy="435" r="2.5" />
    <circle cx="262" cy="422" r="3" />
    <circle cx="288" cy="430" r="2" />
  </g>

  <!-- ==================== RÓTULO H2OH! ==================== -->
  <!-- Faixa Verde do Rótulo -->
  <rect x="183" y="238" width="134" height="102" fill="url(#labelGreen)" rx="2" />

  <!-- Detalhe Superior de Onda Amarela/Limão -->
  <path d="M 183 242 Q 250 252 317 242 L 317 246 Q 250 256 183 246 Z" fill="#D2F824" />

  <!-- NOME H2OH! -->
  <text x="238" y="285"
        text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="28"
        font-weight="900"
        letter-spacing="0.5"
        fill="#FFFFFF">
    H<tspan font-size="20" dy="4">2</tspan><tspan font-size="28" dy="-4">OH</tspan><tspan font-size="28" fill="#D2F824">!</tspan>
  </text>

  <!-- Rodela estilizada de Limão no Rótulo -->
  <g transform="translate(250, 310)">
    <!-- Fatia de Limão Siciliano / Taiti -->
    <circle cx="0" cy="0" r="14" fill="#D4FA1E" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="11" fill="#8CE21A" />
    <!-- Gomos do limão -->
    <path d="M 0 0 L 0 -10 M 0 0 L 7 -7 M 0 0 L 10 0 M 0 0 L 7 7 M 0 0 L 0 10 M 0 0 L -7 7 M 0 0 L -10 0 M 0 0 L -7 -7" stroke="#D4FA1E" stroke-width="1" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- TEXTO LIMÃO -->
  <text x="250" y="333"
        text-anchor="middle"
        font-family="'Arial Black', sans-serif"
        font-size="9.5"
        font-weight="900"
        letter-spacing="1.5"
        fill="#FFFFFF">
    LIMÃO
  </text>

  <!-- ==================== REFLEXO ESPECULAR VERTICAL ==================== -->
  <path d="M 210 120
           L 205 240
           L 205 340
           L 208 440"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.75" />
  <path d="M 218 135
           L 215 235
           L 215 345
           L 217 430"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.5" />
</svg>
